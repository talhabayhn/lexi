name: pages

# Website (landing, privacy, terms, support; TR + EN) on GitHub Pages, built by docs/site/build.py from the
# store drafts in docs/store. One-time setup: Settings → Pages → Source: "GitHub Actions" (docs/RELEASE.md).
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/store/privacy-policy-*.md'
      - 'docs/store/terms-*.md'
      - 'docs/store/graphics/play/icon-512.png'
      - 'docs/design/fonts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build site
        run: python3 docs/site/build.py --out _site
      # Until Pages is enabled (Source: GitHub Actions) only the build is checked and deploy is skipped.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome != 'success'
        run: echo "::warning::GitHub Pages is not enabled yet (Settings → Pages → Source: GitHub Actions); skipping deploy."
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
