name: store-graphics

# Store images and videos from the current app (runbook: docs/RELEASE.md §9). Manual only.
# Re-records every Roborazzi screenshot with the current LexiTheme, captures the gameplay footage
# (StoreFootageCapture, LEXI_STORE_FOOTAGE=1), then tools/store-graphics/build.py + video.py.
# Download the `store-graphics` artifact from the run's Summary page; it mirrors docs/store/graphics.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the result to docs/store/graphics on main'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the commit step rebases onto the latest main

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Record screenshots and gameplay footage
        env:
          LEXI_STORE_FOOTAGE: '1'
        run: ./gradlew recordRoborazziAndroidHostTest --continue

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build images and videos
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
          pip install --quiet pillow numpy
          python3 tools/store-graphics/build.py
          python3 tools/store-graphics/video.py

      - name: Upload store graphics
        uses: actions/upload-artifact@v7
        with:
          name: store-graphics
          path: docs/store/graphics
          retention-days: 30

      - name: Upload refreshed Roborazzi screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-screenshots
          path: |
            **/src/androidHostTest/screenshots/*.png
            feature/game/build/store-footage/**
          retention-days: 7

      # Owner identity, no bot/AI attribution (CLAUDE.md rule 9). Only docs/store/graphics is committed.
      - name: Commit to main
        if: inputs.commit
        run: |
          git config user.name talhabayhn
          git config user.email htbayhan@gmail.com
          git add docs/store/graphics
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "chore(store): regenerate store graphics and videos" \
            -m "Generated by the store-graphics workflow from $GITHUB_SHA."
          # Drop the re-recorded Roborazzi goldens (not committed here) so the rebase sees a clean tree.
          git checkout -- . && git clean -fdq -- '*/src/androidHostTest/screenshots'
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
