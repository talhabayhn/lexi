name: perf

# Android performance on a Gradle managed emulator (ADR 0025, docs/PERF.md). Manual only.
# 1. Regenerates the baseline + startup profile with :benchmark's BaselineProfileGenerator (onboarding + perf tour).
# 2. Measures cold start (StartupBenchmark: no AOT code vs the baseline profile, 10 runs each) and the frame times
#    of one perf tour through the main screens and the game (ScreensBenchmark, 3 runs).
# Results: the run's Summary page and the `perf-results` artifact. Emulator numbers show the trend and the profile's
# gain, not the M8 phone target. With `commit`, the regenerated profile is committed to main.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the regenerated baseline profile to main (otherwise report only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false  # a second dispatch waits instead of killing a long run mid-push

permissions:
  contents: write
  actions: write  # dispatches the build workflow; pushes with GITHUB_TOKEN start no push workflows

env:
  # Software GPU on the headless runner; Macrobenchmark refuses emulators unless told the numbers are for trends.
  GMD_FLAGS: >-
    -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
    -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20
    -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the commit step rebases onto the latest main

      # Same JDK as the build workflow (gradle/gradle-daemon-jvm.properties, Azul 21).
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate baseline profile
        run: ./gradlew :androidApp:generateBaselineProfile $GMD_FLAGS

      - name: Benchmarks
        run: >-
          ./gradlew :benchmark:pixel6Api34BenchmarkReleaseAndroidTest $GMD_FLAGS
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark

      - name: Summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          def stat(d, key):
              v = d.get(key)
              return "-" if v is None else f"{v:.0f}"
          rows = []
          for path in glob.glob("benchmark/build/outputs/**/*benchmarkData.json", recursive=True):
              rows += json.load(open(path)).get("benchmarks", [])
          print("## Emulator results (ms; trend only, not the phone target)\n")
          print("| Test | initial display median (min-max) | full display median (min-max) | frame CPU P50 / P90 / P99 | overrun P90 |")
          print("|---|---|---|---|---|")
          for b in rows:
              m, sm = b.get("metrics", {}), b.get("sampledMetrics", {})
              ti, tf = m.get("timeToInitialDisplayMs", {}), m.get("timeToFullDisplayMs", {})
              f, o = sm.get("frameDurationCpuMs", {}), sm.get("frameOverrunMs", {})
              disp = lambda t: f"{stat(t, 'median')} ({stat(t, 'minimum')}-{stat(t, 'maximum')})" if t else "-"
              frames = f"{f.get('P50', 0):.1f} / {f.get('P90', 0):.1f} / {f.get('P99', 0):.1f}" if f else "-"
              over = f"{o.get('P90', 0):.1f}" if o else "-"
              print(f"| {b.get('name')} | {disp(ti)} | {disp(tf)} | {frames} | {over} |")
          if not rows:
              print("| no results | | | | |")
          EOF
          git status --short -- androidApp/src/release/generated >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: |
            benchmark/build/outputs/**/*.json
            benchmark/build/outputs/**/*.perfetto-trace
            androidApp/src/release/generated/baselineProfiles/
          retention-days: 14

      # Owner identity, no bot/AI attribution (CLAUDE.md rule 9). Only the generated profile is committed.
      - name: Commit to main
        if: inputs.commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name talhabayhn
          git config user.email htbayhan@gmail.com
          git add -A -- androidApp/src/release/generated/baselineProfiles
          if git diff --cached --quiet; then
            echo "No profile changes to commit"
            exit 0
          fi
          git commit -q -m "perf(android): regenerate the baseline profile on CI" \
            -m "Generated by the perf workflow from $GITHUB_SHA."
          git checkout -- . && git clean -fdq -- androidApp/src/release/generated
          pushed=0
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          if [ "$pushed" != 1 ]; then echo "::error::could not rebase and push the profile onto main"; exit 1; fi
          gh workflow run build.yml --ref main || echo "::warning::start the build workflow by hand"
