name: ios

# macOS minutes are expensive (10x on private repos), so this workflow is path-filtered and lean:
# - push to main (Kotlin/Gradle/iosApp changes): link the framework + run iOS simulator tests;
#   xcodebuild (+ simulator launch screenshot) only when iosApp/ or this workflow changed.
# - nightly: full run incl. xcodebuild, skipped when main had no commits in the last 24 h.
# - manual: full run.
on:
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.sq'
      - '**/composeResources/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build-logic/**'
      - 'iosApp/**'
      - '.github/workflows/ios.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap Linux pre-check so the nightly run doesn't spin up macOS when nothing changed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      xcode: ${{ steps.check.outputs.xcode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true; xcode=true
          if [ "$EVENT" = "schedule" ] && [ -z "$(git log --since='24 hours ago' --format=%H -1)" ]; then
            run=false
          fi
          if [ "$EVENT" = "push" ]; then
            xcode=false
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || git diff --name-only "$BEFORE" HEAD | grep -qE '^(iosApp/|\.github/workflows/ios\.yml$)'; then
              xcode=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "xcode=$xcode" >> "$GITHUB_OUTPUT"

  ios:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Link framework and run iOS simulator tests
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 iosSimulatorArm64Test --continue

      - name: Build iosApp (xcodebuild)
        if: needs.changes.outputs.xcode == 'true'
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build/xcode" build

      # The SPM resolve result (ADR 0023): commit it when it is missing or changed, so transitive versions are pinned.
      - name: Upload Package.resolved
        if: needs.changes.outputs.xcode == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-package-resolved
          path: iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: warn
          retention-days: 7

      # tar keeps the executable bit and symlinks, which upload-artifact drops.
      - name: Package Lexi.app for the screenshot job
        if: needs.changes.outputs.xcode == 'true'
        run: tar -czf lexi-app.tgz -C build/xcode/Debug-iphonesimulator Lexi.app

      - name: Upload Lexi.app
        if: needs.changes.outputs.xcode == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-app
          path: lexi-app.tgz
          retention-days: 1

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: '**/build/reports/**'
          retention-days: 7

  # Proof that the app launches and renders on iOS: boots a simulator, installs and launches the app built
  # above, uploads a screenshot. Same gate as xcodebuild (iosApp/ or workflow changes, nightly, manual).
  # Separate job so a flaky simulator boot can be re-run alone without rebuilding.
  screenshot:
    needs: [changes, ios]
    if: needs.changes.outputs.xcode == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUNDLE_ID: dev.talhabayhan.lexi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ios-app

      - name: Boot simulator
        run: |
          tar -xzf lexi-app.tgz
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("SimRuntime[.]iOS-")) | .key as $rt
             | .value[] | select(.name | test("^iPhone")) | {rt: $rt, udid, name}]
            | sort_by(.rt) | last | .udid')
          [ -n "$UDID" ] && [ "$UDID" != "null" ] || { xcrun simctl list devices available; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100

      - name: Install, launch and screenshot
        run: |
          xcrun simctl install "$UDID" Lexi.app
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 15
          xcrun simctl io "$UDID" screenshot lexi-ios.png
          # Fail if the app crashed after launch.
          xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$BUNDLE_ID" \
            || { echo "::error::Lexi is not running after launch (crash?)"; exit 1; }

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshot
          path: lexi-ios.png
          if-no-files-found: warn
          retention-days: 30
