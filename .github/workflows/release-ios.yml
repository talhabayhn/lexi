name: release-ios

# EXPERIMENTAL iOS release (runbook: docs/RELEASE.md). Manual dispatch or tag v*.
# - With APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8_BASE64 and TEAM_ID: signed archive
#   (automatic signing via the App Store Connect API key), export and upload to TestFlight.
# - Without them: unsigned Release archive only, to prove the app archives on CI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z) when not run from a tag'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ARCHIVE: ${{ github.workspace }}/build/Lexi.xcarchive
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Same scheme as Android: MARKETING_VERSION from the tag, build number = versionCode (same formula as
      # gradle.properties / Version.xcconfig). To re-upload the same tag, bump the patch version: App Store
      # Connect rejects a repeated build number for the same version.
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"
          else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          if ! [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then echo "::error::Version '$v' is not x.y.z"; exit 1; fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$code" >> "$GITHUB_ENV"
          echo "iOS $v ($code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check App Store Connect credentials
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
          TEAM: ${{ secrets.TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ] && [ -n "$TEAM" ]; then
            mkdir -p "$RUNNER_TEMP/asc"
            echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::notice::App Store Connect secrets missing; building an unsigned archive only."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      # Builds the Release framework up front so Kotlin errors show here, not inside xcodebuild's log;
      # the Xcode build phase (embedAndSignAppleFrameworkForXcode) then finds it up to date.
      - name: Build shared framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Archive (unsigned)
        if: env.SIGNED != 'true'
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 40; test "${PIPESTATUS[0]}" -eq 0

      - name: Archive (signed)
        if: env.SIGNED == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            TEAM_ID="$TEAM" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -n 60; test "${PIPESTATUS[0]}" -eq 0

      # destination=upload sends the exported build straight to App Store Connect (TestFlight).
      - name: Export and upload to TestFlight
        if: env.SIGNED == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 40; test "${PIPESTATUS[0]}" -eq 0

      - name: Package archive
        if: always()
        run: |
          [ -d "$ARCHIVE" ] && tar -czf lexi-ios-archive.tgz -C build Lexi.xcarchive || echo "no archive"

      - name: Upload archive
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lexi-ios-${{ env.VERSION_NAME }}${{ env.SIGNED == 'true' && '' || '-unsigned' }}
          path: lexi-ios-archive.tgz
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
