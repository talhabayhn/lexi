name: release-android

# Release AAB for Google Play (runbook: docs/RELEASE.md).
# - push to main: unsigned R8 release build only (no secrets) to catch shrinker problems early.
# - tag v*.*.* or manual dispatch: signed AAB from the ANDROID_KEYSTORE_* secrets, uploaded as an artifact
#   and, when PLAY_SERVICE_ACCOUNT_JSON is set, to the Play internal track.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'content-review/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z) when not run from a tag'
        required: false
        default: ''
      upload:
        description: 'Upload to Play internal track (needs PLAY_SERVICE_ACCOUNT_JSON)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel: on a busy main the verification would otherwise never finish; GitHub keeps only
  # the newest pending run, so at most one extra run is queued.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNED: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7

      # The Gradle daemon runs on Azul 21 (gradle/gradle-daemon-jvm.properties); bytecode targets 17.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # versionName from the tag (v1.2.3 -> 1.2.3), versionCode = major*10000 + minor*100 + patch.
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"
          else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          if ! [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then echo "::error::Version '$v' is not x.y.z"; exit 1; fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Version $v ($code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Decode keystore
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (docs/RELEASE.md)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "LEXI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release AAB (R8)
        env:
          LEXI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEXI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEXI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease
          -Plexi.versionName="$VERSION_NAME" -Plexi.versionCode="$VERSION_CODE"

      - name: Verify signature
        if: env.SIGNED == 'true'
        run: jarsigner -verify androidApp/build/outputs/bundle/release/androidApp-release.aab | tail -n 3

      - name: Upload AAB + R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: lexi-android-${{ env.VERSION_NAME }}${{ env.SIGNED == 'true' && '' || '-unsigned' }}
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/mapping/release/mapping.txt
          retention-days: ${{ env.SIGNED == 'true' && 90 || 7 }}

      - name: Check Play credentials
        id: play
        if: env.SIGNED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.upload)
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set; upload the AAB artifact manually."; fi

      # A brand-new app must get its first AAB uploaded by hand in Play Console before the API accepts uploads.
      - name: Upload to Play internal track
        if: steps.play.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.talhabayhan.lexi
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          track: internal
          status: draft

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-android-reports
          path: |
            **/build/reports/**
            androidApp/build/outputs/mapping/release/**
          retention-days: 7
