name: screenshots-record

# Re-records every Roborazzi golden on Linux, the single source of truth (docs/CONVENTIONS.md). Manual only.
# tools/screenshots/classify_goldens.py sorts each changed golden into RENDERING (font/antialiasing only) or SUSPECT
# (new/deleted golden, size, color, moved or missing element). Report: the run's Summary page; old/new/diff images:
# the `golden-review` artifact. With `commit`, RENDERING goldens (plus SUSPECT ones named in `accept` after a
# person reviewed them) are committed to main; the other SUSPECT goldens are not recorded and fail the run.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the re-recorded goldens to main (otherwise report only)'
        type: boolean
        default: false
      accept:
        description: 'Reviewed SUSPECT goldens to commit anyway (space-separated paths from the report)'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the commit step rebases onto the latest main

      # Same JDK as the build workflow (gradle/gradle-daemon-jvm.properties, Azul 21).
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Record goldens
        run: ./gradlew recordRoborazziAndroidHostTest

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Classify changed goldens
        run: |
          pip install --quiet pillow
          python3 tools/screenshots/classify_goldens.py --out build/golden-review

      - name: Upload review images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-review
          path: build/golden-review
          retention-days: 14

      # Owner identity, no bot/AI attribution (CLAUDE.md rule 9). Only goldens are committed.
      - name: Commit to main
        if: inputs.commit
        env:
          ACCEPT: ${{ inputs.accept }}
        run: |
          blocked=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case " $ACCEPT " in *" $path "*) continue ;; esac
            blocked="$blocked $path"
            if git cat-file -e "HEAD:$path" 2>/dev/null; then git checkout -- "$path"; else rm -f "$path"; fi
          done < build/golden-review/suspects.txt
          git config user.name talhabayhn
          git config user.email htbayhan@gmail.com
          git add -A -- '*/src/androidHostTest/screenshots/*.png'
          if git diff --cached --quiet; then
            echo "No goldens to commit"
          else
            git commit -q -m "test(screenshots): re-record goldens on Linux CI" \
              -m "Recorded by the screenshots-record workflow from $GITHUB_SHA."
            git checkout -- . && git clean -fdq -- '*/src/androidHostTest/screenshots'
            pushed=0
            for i in 1 2 3 4; do
              if git pull -q --rebase origin main && git push -q origin HEAD:main; then pushed=1; break; fi
              sleep $((i * 5))
            done
            [ "$pushed" = 1 ] || exit 1
          fi
          if [ -n "$blocked" ]; then
            for path in $blocked; do echo "::error::not recorded, needs review: $path"; done
            exit 1
          fi
