<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<title>Lexi – Splash animasyonu</title>



<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#1F4FBF}
@keyframes lxBg{0%{transform:scale(0)}18%{transform:scale(1)}90%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes lxL{0%,4%{transform:translateX(-320px)}20%{transform:translateX(8px)}26%{transform:translateX(0)}90%{transform:translateX(0);opacity:1}100%{opacity:0}}
@keyframes lxE{0%,10%{transform:translateY(-480px)}26%{transform:translateY(10px)}32%{transform:translateY(0)}90%{transform:translateY(0);opacity:1}100%{opacity:0}}
@keyframes lxX{0%,16%{transform:rotate(-270deg) scale(0)}34%{transform:rotate(10deg) scale(1.08)}40%{transform:rotate(0) scale(1)}90%{opacity:1;transform:rotate(0) scale(1)}100%{opacity:0}}
@keyframes lxI{0%,22%{transform:translateY(420px)}40%{transform:translateY(-8px)}46%{transform:translateY(0)}90%{transform:translateY(0);opacity:1}100%{opacity:0}}
@keyframes lxTag{0%,48%{opacity:0;transform:translateY(12px)}58%{opacity:1;transform:translateY(0)}90%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.lx-a{animation:none !important}}
</style>
</head>
<body data-rendered="1">


<div style="position: relative; width: 390px; height: 844px; background: #F2EBDD; color: #111111; font-family: 'Jost', sans-serif; overflow: hidden">
  <div aria-hidden="true" class="lx-a" style="position: absolute; left: -120px; top: -120px; width: 320px; height: 320px; border-radius: 50%; background: #F2C200; transform-origin: center; animation: lxBg 3.6s cubic-bezier(.2,.8,.2,1) infinite"></div>
  <div aria-hidden="true" class="lx-a" style="position: absolute; right: -90px; bottom: -90px; width: 260px; height: 260px; background: #1F4FBF; transform-origin: center; animation: lxBg 3.6s cubic-bezier(.2,.8,.2,1) infinite"></div>

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
    <div style="display: flex; gap: 8px" role="img" aria-label="Lexi">
      <div class="lx-a" style="width: 74px; height: 74px; background: #D9281C; border: 4px solid #111111; box-sizing: border-box; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 48px; animation: lxL 3.6s cubic-bezier(.2,.8,.2,1) infinite">L</div>
      <div class="lx-a" style="width: 74px; height: 74px; border-radius: 50%; background: #F2C200; border: 4px solid #111111; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 48px; animation: lxE 3.6s cubic-bezier(.2,.8,.2,1) infinite">E</div>
      <div class="lx-a" style="width: 74px; height: 74px; border-radius: 50% 0 50% 0; background: #1F4FBF; border: 4px solid #111111; box-sizing: border-box; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 48px; animation: lxX 3.6s cubic-bezier(.2,.8,.2,1) infinite">X</div>
      <div class="lx-a" style="width: 74px; height: 74px; background: #111111; color: #F2EBDD; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 48px; animation: lxI 3.6s cubic-bezier(.2,.8,.2,1) infinite">I</div>
    </div>
    <span class="lx-a" style="font-weight: 700; font-size: 15px; letter-spacing: .16em; animation: lxTag 3.6s ease-out infinite">A'DAN Z'YE İNGİLİZCE</span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px; padding: 10px 12px; background: #FFFFFF; border: 2px solid #111111; font-size: 12px; line-height: 1.45">
    <b>Uygulamada:</b> toplam ~1,2 sn. L soldan kayar, E düşüp sekiyor, X dönerek büyür, I alttan yükselir; her iniş hafif bir titreşim (light haptic) ve kısa bir "tık" sesiyle. Sistem "hareketi azalt" açıksa logo animasyonsuz gelir. Bu demo yavaşlatılmış ve döngüde.
  </div>
</div>




</body></html>
