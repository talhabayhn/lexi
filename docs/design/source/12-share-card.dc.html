<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Lexi – Paylaşım kartı</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#1F4FBF}
</style>
</helmet>
<div style="position: relative; width: 432px; height: 540px; box-sizing: border-box; padding: 28px; background: #F2EBDD; color: #111111; font-family: 'Jost', sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%; background: #F2C200; border: 4px solid #111111"></div>
  <div style="position: relative; display: flex; flex-direction: column; gap: 2px">
    <span style="font-weight: 700; font-size: 13px; letter-spacing: .14em">GÜNÜN ÇARKI · 14 EKİM 2026</span>
    <span style="font-weight: 800; font-size: 64px; line-height: .95">21/26</span>
    <span style="font-weight: 600; font-size: 15px">A1 · 34 sn kala bitti · 7 gün seri</span>
  </div>

  <div style="position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; padding: 16px; background: #FFFFFF; border: 3px solid #111111; box-shadow: 6px 6px 0 #111111">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="26">
      <div style="{{c.style}}">{{c.ch}}</div>
    </sc-for>
  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; margin-top: auto">
    <div style="display: flex; align-items: center; gap: 8px">
      <div aria-hidden="true" style="display: flex; gap: 3px">
        <div style="width: 16px; height: 16px; background: #D9281C"></div>
        <div style="width: 16px; height: 16px; border-radius: 50%; background: #F2C200"></div>
        <div style="width: 16px; height: 16px; border-radius: 50% 0 50% 0; background: #1F4FBF"></div>
      </div>
      <span style="font-weight: 800; font-size: 24px">lexi</span>
    </div>
    <span style="font-weight: 600; font-size: 14px">[MAĞAZA LİNKİ]</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":432,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const bad = 'EMQ', pass = 'CHX';
    const base = 'height:40px;box-sizing:border-box;border:2px solid #111111;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;';
    const cells = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((ch) => {
      let s = 'background:#1F4FBF;color:#FFFFFF;border-radius:50%;';
      if (bad.includes(ch)) s = 'background:#D9281C;color:#FFFFFF;border-radius:0;';
      else if (pass.includes(ch)) s = 'background:#F2C200;color:#111111;border-radius:50% 0 50% 0;';
      return { ch, style: base + s };
    });
    return { cells };
  }
}
</script>
</body>
</html>
