<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Lexi – İstatistikler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111;text-decoration:none}a:hover{color:#1F4FBF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 20px; background: #F2EBDD; color: #111111; font-family: 'Jost', sans-serif; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="BauhausMenu.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border: 3px solid #111111; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-weight: 800; font-size: 28px">İstatistikler</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 3px solid #111111; background: #FFFFFF">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
      <div style="{{t.style}}">
        <div aria-hidden="true" style="{{t.shape}}"></div>
        <span style="font-weight: 800; font-size: 30px; line-height: 1">{{t.v}}</span>
        <span style="font-weight: 600; font-size: 13px">{{t.l}}</span>
      </div>
    </sc-for>
  </div>

  <div style="border: 3px solid #111111; background: #FFFFFF; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-weight: 800; font-size: 16px">Bu hafta öğrenilen kelime</span>
      <span style="font-weight: 600; font-size: 13px">toplam 177</span>
    </div>
    <div style="position: relative; height: 130px; display: flex; align-items: flex-end; gap: 10px; border-bottom: 2px solid #111111" role="img" aria-label="Günlük öğrenilen kelime: Pzt 18, Sal 26, Çar 12, Per 31, Cum 22, Cmt 40, Paz 28">
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 30px; border-top: 1px dashed #B8B0A0"></div>
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 80px; border-top: 1px dashed #B8B0A0"></div>
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative">
          <span style="{{b.labelStyle}}">{{b.v}}</span>
          <div style="{{b.style}}"></div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="7"><span style="{{b.dayStyle}}">{{b.d}}</span></sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-weight: 700; font-size: 12px; letter-spacing: .14em">SEVİYE İLERLEMESİ</span>
    <sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 34px; font-weight: 800; font-size: 15px">{{l.c}}</span>
        <div style="flex: 1; height: 12px; border: 2px solid #111111; background: #FFFFFF"><div style="{{l.fill}}"></div></div>
        <span style="width: 64px; text-align: right; font-weight: 600; font-size: 13px">{{l.t}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-weight: 700; font-size: 12px; letter-spacing: .14em">EN ÇOK ZORLANDIĞIN HARFLER</span>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{hard}}" as="h" hint-placeholder-count="4">
        <div style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px; border: 3px solid #111111; background: #FFFFFF">
          <div style="width: 30px; height: 30px; background: #D9281C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px">{{h.ch}}</div>
          <span style="font-weight: 700; font-size: 13px; line-height: 1.1">%{{h.p}}<br><span style="font-weight: 500">doğru</span></span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tileData = [['412', 'öğrenilen kelime', 'border-radius:50%;background:#1F4FBF;'], ['%78', 'doğruluk', 'background:#D9281C;'], ['12 gün', 'en uzun seri', 'border-radius:50% 0 50% 0;background:#F2C200;'], ['63', 'tamamlanan çark', 'background:#111111;']];
    const tiles = tileData.map(([v, l, sh], i) => ({ v, l, shape: 'width:16px;height:16px;border:2px solid #111111;box-sizing:border-box;' + sh, style: 'padding:12px;display:flex;flex-direction:column;gap:4px;' + (i % 2 ? 'border-left:2px solid #111111;' : '') + (i > 1 ? 'border-top:2px solid #111111;' : '') }));
    const vals = [['Pzt', 18], ['Sal', 26], ['Çar', 12], ['Per', 31], ['Cum', 22], ['Cmt', 40], ['Paz', 28]];
    const max = 50, H = 120;
    const bars = vals.map(([d, v], i) => {
      const today = i === 6;
      return {
        d, v: today ? String(v) : '',
        style: 'width:100%;height:' + Math.round(v / max * H) + 'px;background:#1F4FBF;' + (today ? 'outline:3px solid #111111;outline-offset:-3px;' : ''),
        labelStyle: 'font-weight:800;font-size:13px;margin-bottom:4px;' + (today ? '' : 'visibility:hidden;'),
        dayStyle: 'flex:1;text-align:center;font-size:12px;font-weight:' + (today ? '800' : '500') + ';'
      };
    });
    const levels = [['A1', 412, 850], ['A2', 96, 900], ['B1', 0, 1200]].map(([c, d, t]) => ({ c, t: d + ' / ' + t, fill: 'height:100%;width:' + Math.round(d / t * 100) + '%;background:#111111;' }));
    const hard = [['X', 32], ['Q', 45], ['Y', 58], ['V', 61]].map(([ch, p]) => ({ ch, p }));
    return { tiles, bars, levels, hard };
  }
}
</script>
</body>
</html>
