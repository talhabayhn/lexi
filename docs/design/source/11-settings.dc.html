<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Lexi – Ayarlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111;text-decoration:none}a:hover{color:#1F4FBF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 20px; background: #F2EBDD; color: #111111; font-family: 'Jost', sans-serif; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="BauhausMenu.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border: 3px solid #111111; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-weight: 800; font-size: 28px">Ayarlar</span>
  </div>

  <button style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #111111; color: #F2EBDD; border: 3px solid #111111; box-shadow: 5px 5px 0 #D9281C; font-family: 'Jost', sans-serif; text-align: left">
    <div aria-hidden="true" style="width: 34px; height: 34px; flex-shrink: 0; background: #F2C200; transform: rotate(45deg)"></div>
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 800; font-size: 18px">Lexi Pro</span><span style="font-weight: 500; font-size: 13px">Reklamsız · tüm seviyeler · sınav paketleri</span></span>
    <span style="font-weight: 800; font-size: 14px; color: #F2C200">[FİYAT]</span>
  </button>

  <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-weight: 700; font-size: 12px; letter-spacing: .14em">{{s.title}}</span>
      <div style="border: 3px solid #111111; background: #FFFFFF">
        <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
          <div style="{{r.rowStyle}}">
            <span style="flex: 1; font-weight: 600; font-size: 16px">{{r.label}}</span>
            <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ true }}">
              <button role="switch" aria-checked="{{r.ariaOn}}" aria-label="{{r.label}}" style="{{r.track}}"><div style="{{r.knob}}"></div></button>
            </sc-if>
            <sc-if value="{{r.isValue}}" hint-placeholder-val="{{ false }}">
              <span style="font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px">{{r.value}}
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="square"><path d="M9 5l7 7-7 7"></path></svg>
              </span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <span style="margin-top: auto; font-size: 12px; font-weight: 500; text-align: center">Lexi 1.0.0 · Gizlilik · Kullanım koşulları · Satın alımları geri yükle</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['OYUN', [['Ses efektleri', true], ['Titreşim', true], ['Doğru cevapta telaffuzu çal', true], ['Klasik mod süresi', '3:00']]],
      ['ÖĞRENME', [['Günlük hatırlatma', '20:00'], ['Günlük hedef', '1 çark'], ['Kelime defteri tekrarları', true]]],
      ['DİL', [['Arayüz dili', 'Türkçe'], ['İpucu dili', 'Türkçe'], ['İngilizce aksanı', 'US']]]
    ];
    const sections = data.map(([title, rows]) => ({
      title,
      rows: rows.map(([label, v], i) => {
        const isToggle = typeof v === 'boolean';
        return {
          label, isToggle, isValue: !isToggle, value: isToggle ? '' : v, ariaOn: isToggle && v ? 'true' : 'false',
          rowStyle: 'display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;' + (i > 0 ? 'border-top:2px solid #111111;' : ''),
          track: 'width:54px;height:30px;flex-shrink:0;padding:0;position:relative;border:3px solid #111111;background:' + (v ? '#1F4FBF' : '#F2EBDD') + ';',
          knob: 'position:absolute;top:3px;left:' + (v ? '27px' : '3px') + ';width:18px;height:18px;border-radius:50%;background:' + (v ? '#F2C200' : '#111111') + ';border:2px solid #111111;box-sizing:border-box;'
        };
      })
    }));
    return { sections };
  }
}
</script>
</body>
</html>
