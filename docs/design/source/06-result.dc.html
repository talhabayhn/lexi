<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Lexi – Oyun sonu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111;text-decoration:none}a:hover{color:#1F4FBF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 28px; background: #F2EBDD; color: #111111; font-family: 'Jost', sans-serif; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; right: -50px; top: -50px; width: 170px; height: 170px; border-radius: 50%; background: #F2C200; border: 3px solid #111111"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 2px">
    <span style="font-weight: 700; font-size: 13px; letter-spacing: .14em">A1 · KLASİK · ÇARK TAMAM</span>
    <span style="font-weight: 800; font-size: 76px; line-height: .95">340</span>
    <span style="font-weight: 600; font-size: 15px">puan · en iyi serin ×6 · kalan süre 0:12</span>
  </div>

  <div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 3px solid #111111; background: #FFFFFF">
    <div style="padding: 12px; display: flex; flex-direction: column; gap: 6px">
      <div aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #1F4FBF; border: 2px solid #111111"></div>
      <span style="font-weight: 800; font-size: 30px; line-height: 1">19</span><span style="font-weight: 600; font-size: 13px">doğru</span>
    </div>
    <div style="padding: 12px; display: flex; flex-direction: column; gap: 6px; border-left: 3px solid #111111">
      <div aria-hidden="true" style="width: 22px; height: 22px; background: #D9281C; border: 2px solid #111111"></div>
      <span style="font-weight: 800; font-size: 30px; line-height: 1">3</span><span style="font-weight: 600; font-size: 13px">yanlış</span>
    </div>
    <div style="padding: 12px; display: flex; flex-direction: column; gap: 6px; border-left: 3px solid #111111">
      <div aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50% 0 50% 0; background: #F2C200; border: 2px solid #111111"></div>
      <span style="font-weight: 800; font-size: 30px; line-height: 1">4</span><span style="font-weight: 600; font-size: 13px">pas</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-weight: 800; font-size: 20px">Tekrar edilecekler</span>
      <span style="font-weight: 600; font-size: 13px">7 kelime defterine eklendi</span>
    </div>
    <div style="border: 3px solid #111111; background: #FFFFFF; box-shadow: 6px 6px 0 #111111">
      <sc-for list="{{rows}}" as="w" hint-placeholder-count="4">
        <div style="{{w.row}}">
          <div aria-hidden="true" style="{{w.chip}}">{{w.letter}}</div>
          <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
            <span style="font-weight: 800; font-size: 19px; line-height: 1.1">{{w.en}}</span>
            <span style="font-weight: 500; font-size: 13px">{{w.tr}} · <i>{{w.ex}}</i></span>
          </div>
          <button aria-label="{{w.listen}}" style="width: 44px; height: 44px; flex-shrink: 0; border: 2px solid #111111; background: #F2EBDD; color: #111111; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9a4 4 0 0 1 0 6"></path></svg>
          </button>
        </div>
      </sc-for>
      <div style="padding: 10px 12px; font-weight: 700; font-size: 14px; border-top: 2px solid #111111">+3 kelime daha · Tümünü gör →</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: auto">
    <a href="BauhausSeviye.dc.html" style="grid-column: span 2; height: 60px; background: #D9281C; color: #FFFFFF; border: 3px solid #111111; box-shadow: 5px 5px 0 #111111; display: flex; align-items: center; justify-content: center; box-sizing: border-box; font-weight: 800; font-size: 20px; letter-spacing: .08em">TEKRAR OYNA</a>
    <button style="height: 60px; background: #FFFFFF; color: #111111; border: 3px solid #111111; box-shadow: 5px 5px 0 #111111; font-family: 'Jost', sans-serif; font-weight: 800; font-size: 16px">Paylaş</button>
  </div>
  <a href="BauhausMenu.dc.html" style="align-self: center; font-weight: 700; font-size: 15px; text-decoration: underline; padding: 6px 12px">Ana menüye dön</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chipBase = 'width:34px;height:34px;flex-shrink:0;box-sizing:border-box;border:2px solid #111111;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;';
    const kinds = {
      bad: 'background:#D9281C;color:#FFFFFF;border-radius:0;',
      pass: 'background:#F2C200;color:#111111;border-radius:50% 0 50% 0;'
    };
    const data = [
      ['C', 'chair', 'sandalye', 'Sit on the chair.', 'pass'],
      ['E', 'egg', 'yumurta', 'I eat an egg.', 'bad'],
      ['H', 'horse', 'at', 'The horse runs.', 'pass'],
      ['M', 'mirror', 'ayna', 'Look in the mirror.', 'bad']
    ];
    const rows = data.map((d, i) => ({
      letter: d[0], en: d[1], tr: d[2], ex: d[3], listen: d[1] + ' telaffuzunu dinle',
      chip: chipBase + kinds[d[4]],
      row: 'display:flex;align-items:center;gap:12px;padding:10px 12px;' + (i > 0 ? 'border-top:2px solid #111111;' : '')
    }));
    return { rows };
  }
}
</script>
</body>
</html>
