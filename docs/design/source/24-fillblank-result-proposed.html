<!doctype html>
<html lang="tr"><!-- PROPOSED (not approved): fill-the-blank result. Source with logic; screens/24-... is the rendered export. -->
<head><meta charset="utf-8"><title>Lexi – Boşluk doldurma: sonuç (ÖNERİ)</title>
<style>
@font-face{font-family:Jost;font-weight:500;src:url('../fonts/Jost-Medium.ttf')}
@font-face{font-family:Jost;font-weight:600;src:url('../fonts/Jost-SemiBold.ttf')}
@font-face{font-family:Jost;font-weight:700;src:url('../fonts/Jost-Bold.ttf')}
@font-face{font-family:Jost;font-weight:800;src:url('../fonts/Jost-ExtraBold.ttf')}
body{margin:0}
</style>
</head><body>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;padding:24px 20px 28px;background:#F7F4EE;color:#1F242D;font-family:Jost,sans-serif;display:flex;flex-direction:column;gap:16px;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:#E29E2E;border:3px solid #1F242D"></div>

  <div style="position:relative;display:flex;flex-direction:column;gap:2px">
    <span style="font-weight:700;font-size:13px;letter-spacing:.14em">A1 · BOŞLUK · TAMAM</span>
    <span style="font-weight:800;font-size:76px;line-height:.95">96</span>
    <span style="font-weight:600;font-size:15px">puan · en iyi serin ×4 · kalan süre 0:21</span>
  </div>

  <div style="position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:3px solid #1F242D;background:#fff">
    <div style="padding:12px;display:flex;flex-direction:column;gap:6px"><div aria-hidden="true" style="width:22px;height:22px;border-radius:50%;background:#3D68B2;border:2px solid #1F242D"></div><span style="font-weight:800;font-size:30px;line-height:1">7</span><span style="font-weight:600;font-size:13px">doğru</span></div>
    <div style="padding:12px;display:flex;flex-direction:column;gap:6px;border-left:3px solid #1F242D"><div aria-hidden="true" style="width:22px;height:22px;background:#E0534C;border:2px solid #1F242D"></div><span style="font-weight:800;font-size:30px;line-height:1">2</span><span style="font-weight:600;font-size:13px">yanlış</span></div>
    <div style="padding:12px;display:flex;flex-direction:column;gap:6px;border-left:3px solid #1F242D"><div aria-hidden="true" style="width:22px;height:22px;border-radius:50% 0 50% 0;background:#E29E2E;border:2px solid #1F242D"></div><span style="font-weight:800;font-size:30px;line-height:1">1</span><span style="font-weight:600;font-size:13px">pas</span></div>
  </div>

  <div style="position:relative;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:800;font-size:20px">Tekrar edilecekler</span><span style="font-weight:600;font-size:13px">3 cümle defterine eklendi</span></div>
    <div id="rows" style="border:3px solid #1F242D;background:#fff;box-shadow:6px 6px 0 #1F242D"></div>
  </div>

  <div style="position:relative;display:flex;flex-direction:column;gap:10px;margin-top:auto">
    <a style="height:60px;background:#E0534C;color:#fff;border:3px solid #1F242D;box-shadow:5px 5px 0 #1F242D;display:flex;align-items:center;justify-content:center;box-sizing:border-box;font-weight:800;font-size:20px;letter-spacing:.08em">TEKRAR OYNA</a>
    <a style="align-self:center;font-weight:700;font-size:15px;text-decoration:underline;padding:6px 12px">Ana menüye dön</a>
  </div>
</div>
<script>

// Mirrors GameUiMapper.blankExample (feature:game): whole-word, case-insensitive, spaces of multi-word answers stay.
function blankRegex(answer){const w=answer.trim().split(' ').filter(Boolean);return new RegExp('\\b'+w.join('\\s+')+'\\b','i');}
function splitSentence(example,answer){const m=blankRegex(answer).exec(example);return {before:example.slice(0,m.index),after:example.slice(m.index+m[0].length),len:answer.replace(/ /g,'').length};}
const CHIP={ // wheel-chip look per state (04-game / tokens): correct circle blue, wrong square red, passed leaf yellow, current ink square, todo cream circle
 correct:'background:#3D68B2;color:#fff;border-radius:50%;border:2px solid #1F242D;',
 wrong:'background:#E0534C;color:#fff;border-radius:0;border:2px solid #1F242D;',
 pass:'background:#E29E2E;color:#1F242D;border-radius:50% 0 50% 0;border:2px solid #1F242D;',
 current:'background:#1F242D;color:#E29E2E;border-radius:0;transform:scale(1.3);',
 todo:'background:#F7F4EE;color:#1F242D;border-radius:50%;border:2px solid #1F242D;'};

// Each row: state chip (number in the round), the sentence with the answer filled in (bold), Turkish line, listen button.
const rows=[['wrong', 'The bridge is closed.', 'BRIDGE', 'Köprü kapalı.', 3], ['wrong', 'Is there any cheese?', 'CHEESE', 'Peynir var mı?', 7], ['pass', 'I lost my ticket.', 'TICKET', 'Biletimi kaybettim.', 5]];
const spk='<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9a4 4 0 0 1 0 6"></path></svg>';
document.getElementById('rows').innerHTML=rows.map(([s,ex,ans,tr,n],i)=>{
  const sp=splitSentence(ex,ans);
  return `<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;${i?'border-top:2px solid #1F242D;':''}">
  <div aria-hidden="true" style="width:34px;height:34px;flex-shrink:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;${CHIP[s]}">${n}</div>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0"><span style="font-weight:600;font-size:17px;line-height:1.15">${sp.before}<b style="font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px">${ans.toLowerCase()}</b>${sp.after}</span><span style="font-weight:500;font-size:13px">${tr}</span></div>
  <button aria-label="${ans.toLowerCase()} telaffuzunu dinle" style="width:44px;height:44px;flex-shrink:0;border:2px solid #1F242D;background:#F7F4EE;color:#1F242D;display:flex;align-items:center;justify-content:center;padding:0">${spk}</button></div>`;}).join('')
 +`<div style="padding:10px 12px;font-weight:700;font-size:14px;border-top:2px solid #1F242D">+7 doğru cümle · Tümünü gör →</div>`;
</script></body></html>
