<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Lexi – Joker seçimi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#1F4FBF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #F2EBDD; color: #111111; font-family: 'Jost', sans-serif; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 35px; top: 90px; width: 320px; height: 320px; border-radius: 50%; border: 3px solid #111111; box-sizing: border-box"></div>
  <div aria-hidden="true" style="position: absolute; left: 105px; top: 160px; width: 180px; height: 180px; border-radius: 50%; background: #F2C200; border: 3px solid #111111; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 96px">K</div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(17,17,17,.55)"></div>

  <div style="position: absolute; left: 20px; right: 20px; top: 24px; display: flex; justify-content: center">
    <span style="padding: 6px 12px; background: #FFFFFF; border: 3px solid #111111; font-weight: 800; font-size: 14px">Süre işlemeye devam ediyor · 1:31</span>
  </div>

  <div role="dialog" aria-label="Joker kullan" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 20px 28px; background: #F2EBDD; border-top: 4px solid #111111; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-weight: 800; font-size: 24px">Joker kullan</span>
      <button aria-label="Kapat" style="width: 44px; height: 44px; border: 3px solid #111111; background: #FFFFFF; color: #111111; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <sc-for list="{{jokers}}" as="j" hint-placeholder-count="4">
      <button style="{{j.btn}}">
        <div style="{{j.icon}}">{{j.count}}</div>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-weight: 800; font-size: 17px">{{j.name}}</span>
          <span style="font-weight: 500; font-size: 13px">{{j.desc}}</span>
        </span>
        <span style="font-weight: 800; font-size: 14px; padding: 3px 8px; border: 2px solid #111111; background: #F2EBDD">{{j.cost}}</span>
      </button>
    </sc-for>
    <button style="height: 56px; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #111111; color: #F2C200; border: 3px solid #111111; font-family: 'Jost', sans-serif; font-weight: 800; font-size: 16px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#F2C200"><path d="M7 4v16l13-8z"></path></svg>
      Kısa reklam izle · +1 joker
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Harf aç', 'Sıradaki boş kutuya doğru harfi koyar', '−10 sn', 2, '#1F4FBF', '50%'],
      ['Çeldiricileri temizle', 'Yanlış harf butonlarını kaldırır', '−15 sn', 1, '#D9281C', '0'],
      ['Örnek cümle', 'Kelimeyi boşlukla bir cümlede gösterir', '−5 puan', 3, '#F2C200', '50% 0 50% 0'],
      ['Telaffuzu dinle', 'Cevabı sesli okur (C1 ve üstünde kapalı)', '−10 puan', 0, '#FFFFFF', '0']
    ];
    const jokers = data.map(([name, desc, cost, count, col, rad]) => ({
      name, desc, cost, count: String(count),
      btn: 'display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:68px;box-sizing:border-box;text-align:left;font-family:Jost,sans-serif;color:#111111;border:3px solid #111111;background:#FFFFFF;' + (count === 0 ? 'opacity:.5;' : 'box-shadow:3px 3px 0 #111111;'),
      icon: 'width:40px;height:40px;flex-shrink:0;border:2px solid #111111;box-sizing:border-box;border-radius:' + rad + ';background:' + col + ';color:' + (col === '#F2C200' || col === '#FFFFFF' ? '#111111' : '#FFFFFF') + ';display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;'
    }));
    return { jokers };
  }
}
</script>
</body>
</html>
