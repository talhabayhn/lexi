<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Lexi – Sınav paketleri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111;text-decoration:none}a:hover{color:#1F4FBF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 20px; background: #F2EBDD; color: #111111; font-family: 'Jost', sans-serif; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="BauhausMenu.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border: 3px solid #111111; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-weight: 800; font-size: 28px">Sınav paketleri</span>
  </div>

  <div style="position: relative; overflow: hidden; padding: 14px 16px; background: #F2C200; border: 3px solid #111111; box-shadow: 5px 5px 0 #111111; display: flex; flex-direction: column; gap: 4px">
    <div aria-hidden="true" style="position: absolute; right: -24px; bottom: -24px; width: 90px; height: 90px; border-radius: 50%; background: #1F4FBF; border: 3px solid #111111"></div>
    <span style="position: relative; font-weight: 800; font-size: 20px">Sınava çark çevirerek hazırlan</span>
    <span style="position: relative; font-weight: 500; font-size: 14px; max-width: 250px">Her paket, sınavın resmi kelime listesine göre seviyelendirilmiş çarklardan oluşur.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{packs}}" as="p" hint-placeholder-count="6">
      <button style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 76px; box-sizing: border-box; background: #FFFFFF; color: #111111; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111; font-family: 'Jost', sans-serif; text-align: left">
        <div style="{{p.badge}}">{{p.short}}</div>
        <span style="flex: 1; display: flex; flex-direction: column; min-width: 0">
          <span style="font-weight: 800; font-size: 17px">{{p.name}}</span>
          <span style="font-weight: 500; font-size: 13px">{{p.desc}}</span>
        </span>
        <span style="{{p.tag}}">{{p.status}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['LGS', 'LGS İngilizce', '8. sınıf · ünite bazlı · 600 kelime', '%34', false, '#D9281C', '0'],
      ['MEB', 'MEB müfredatı', '5–12. sınıf ünite kelimeleri', 'PRO', true, '#1F4FBF', '50%'],
      ['YKS', 'YKS-Dil', 'Akademik + genel · 1500 kelime', 'PRO', true, '#F2C200', '50% 0 50% 0'],
      ['YDS', 'YDS / YÖKDİL', 'Akademik metin kelimeleri · 2000', 'PRO', true, '#111111', '0'],
      ['IEL', 'IELTS', 'Academic Word List · 1800', 'PRO', true, '#D9281C', '50%'],
      ['TOE', 'TOEFL', 'Kampüs ve akademik · 1800', 'PRO', true, '#1F4FBF', '50% 0 50% 0']
    ];
    const packs = data.map(([short, name, desc, status, pro, col, rad]) => ({
      short, name, desc, status,
      badge: 'width:48px;height:48px;flex-shrink:0;border:2px solid #111111;box-sizing:border-box;border-radius:' + rad + ';background:' + col + ';color:' + (col === '#F2C200' ? '#111111' : '#FFFFFF') + ';display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;',
      tag: 'font-weight:800;font-size:12px;padding:3px 7px;border:2px solid #111111;' + (pro ? 'background:#111111;color:#F2C200;' : 'background:#F2EBDD;color:#111111;')
    }));
    return { packs };
  }
}
</script>
</body>
</html>
